services:
  backend:
    container_name: backend
    build:
      context: ./src
      dockerfile: src/Dockerfile-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pg-data:/var/lib/postgresql/
    ports:
      - "5433:5432"

volumes:
  pg-data:
    name: grandline-postgres-data