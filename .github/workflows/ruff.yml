name: Ruff

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ruff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check src

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check src
